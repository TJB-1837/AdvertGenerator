    <script type="application/ld+json">
      {
        "@context": "https://schema.org",

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "FAQPage",
        "mainEntity": [
          {
            "@type": "Question",
            "name": "What is Adrafteo?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Adrafteo is a web app for resellers who want to save reusable marketplace listing templates, fill in changing product details, and copy ready-to-post adverts."
            }
          },
          {
            "@type": "Question",
            "name": "How do reusable listing templates work?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Write a title and description once, then add variables such as [Brand], [Size], or [Condition]. When you generate an advert, Adrafteo replaces those variables with the details of the item you are listing."
            }
          },
          {
            "@type": "Question",
            "name": "Can I use one template across different marketplaces?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Yes. Adrafteo keeps your templates reusable so you can adapt the same listing workflow for Vinted, eBay, Depop, and other marketplaces. You can adjust the wording whenever a platform needs a different format."
            }
          },
          {
            "@type": "Question",
            "name": "Are my templates private?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Your saved templates belong to your authenticated Adrafteo account. They are stored per user in Supabase and are not intended to be shared publicly."
            }
          },
          {
            "@type": "Question",
            "name": "Does Adrafteo use AI to generate adverts?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "No. Adrafteo currently generates adverts in your browser by replacing the variables in your own templates. Your copy stays under your control and no AI service is required for ordinary generation."
            }
          }
        ]
      }
